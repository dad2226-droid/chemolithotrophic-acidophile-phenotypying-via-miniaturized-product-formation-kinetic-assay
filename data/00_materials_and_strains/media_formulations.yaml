schema_version: '1.0'
document_type: study_medium_inventory
title: Media formulations used in this study
reading_guide:
  sources: Paths are repository-root relative; source node records the local medium ID.
  scope: 13 distinct documented formulations, including basal preparations. Experimental substrate/additive
    series are not additional base recipes.
  concentrations: Nominal prepared-medium concentrations with the source recipe precision. Stock mixing,
    dye/inoculum additions and measured concentrations are specified by each experiment.
  omissions: An ingredient absent from a recipe is not added by that recipe; this does not describe experimental
    treatment additions.
  SM4: SM4_BS_microplate and SM4_BS_tube are deliberately separate even though both source files use the
    local identifier SM4_BS.
  pH: Preparation targets are not measured initial-mixture pH. null means no common preparation pH is
    assigned.
  references: References identify parent formulations; locally documented ingredient amounts remain controlling.
