    Surface Proteins of *Acidithiobacillus ferrooxidans*: Impact of Localization on the Binding and Recovery
    of Divalent Metal Cations. *ACS Appl. Mater. Interfaces* 2022, *14* (8), 10125–10133. [DOI: 10.1021/acsami.1c23682](https://doi.org/10.1021/acsami.1c23682).'
  Silverman1959: 'Silverman, M. P.; Lundgren, D. G. Studies on the Chemoautotrophic Iron Bacterium *Ferrobacillus
    ferrooxidans*. I. An Improved Medium and a Harvesting Procedure for Securing High Cell Yields. *J.
    Bacteriol.* 1959, *77* (5), 642–647. [DOI: 10.1128/jb.77.5.642-647.1959](https://doi.org/10.1128/jb.77.5.642-647.1959).'
  Starkey1925: 'Starkey, R. L. Concerning the Physiology of *Thiobacillus thiooxidans*, an Autotrophic
    Bacterium Oxidizing Sulfur under Acid Conditions. *J. Bacteriol.* 1925, *10* (2), 135–163. [DOI: 10.1128/jb.10.2.135-163.1925](https://doi.org/10.1128/jb.10.2.135-163.1925).'
  Inaba2018: 'Inaba, Y.; Banerjee, I.; Kernan, T.; Banta, S. Transposase-Mediated Chromosomal Integration
    of Exogenous Genes in *Acidithiobacillus ferrooxidans*. *Appl. Environ. Microbiol.* 2018, *84* (21),
    e01381-18. [DOI: 10.1128/AEM.01381-18](https://doi.org/10.1128/AEM.01381-18).'
  DSMZ882: Leibniz Institute DSMZ–German Collection of Microorganisms and Cell Cultures. *Leptospirillum
