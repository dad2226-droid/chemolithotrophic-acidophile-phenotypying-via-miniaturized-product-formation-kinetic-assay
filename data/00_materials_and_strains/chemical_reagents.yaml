schema_version: '1.0'
document_type: chemical_reagent_inventory
title: Chemical identities and reported reagent information
scope: Chemical identities and bottle records for tested additives, excluded preparations, basal-medium
  reagents and analytical reagents. Experimental concentrations and batch assignments remain in family
  metadata.
reading_guide:
  reagent_id: A reagent_id or preparation_reagent_id selects a key under reagents. Chemical identity does
    not change an experiment concentration basis or numerical value.
  bottle_scope: Listed bottles are not assigned to individual experiments or families; an identity match
    does not assign a bottle lot to every experiment.
  identifiers: Lot and source/catalog values retain their experimenter-reported labels and strings. Source
    identifiers are not automatically verified catalogs; separately documented catalog identities remain
    explicit.
  hydration: not_reported does not mean anhydrous; unspecified_hydrate means that water stoichiometry
    is not recorded.
  assay: Reported grade/assay strings preserve their basis and range. Fe-basis and trace-metals-basis
    values are not whole-compound purity measurements.
  aliases: Gallium in Ga-basis additions refers to gallium supplied from gallium sulfate. Citrate in experiment
    identifiers denotes citric acid. Tetrathionate refers to potassium tetrathionate as the preparation
    reagent. Experiment/group IDs containing potassium_gluconate select sodium gluconate in
    the experiment metadata.
