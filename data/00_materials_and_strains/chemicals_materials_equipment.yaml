method_references:
  Dailey2026:
    citation: 'Dailey, D. A.; Hernández-Pagán, E.; Bailey, S.; Bavaresco, S. T.; Raffaele, N. E.; Piatt-Price,
      A.; Carneiro, J. S. A.; Austin, R. N.; Doherty, C. J.; Banta, S. Biophytometallurgy: Biomining Metals
      from Plant Resources. bioRxiv (preprint), 2026. DOI: 10.64898/2026.08.27.747594.'
    citation_style: ACS
    doi: 10.64898/2026.08.27.747594
    url: https://doi.org/10.64898/2026.08.27.747594
    publication_type: preprint
    bibliography: chemicals_materials_equipment.md#references
    bibliography_number: 85
solubility_references:
  S1:
    citation: Baker, S. L., et al. (2019). Transforming protein-polymer conjugate purification by tuning
      protein solubility. Nature Communications 10, 4718.
    doi: 10.1038/s41467-019-12612-9
    locator: 'Introduction: ammonium sulfate water solubility, 4.1 M at 25 °C.'
  S2:
    citation: Kim, R., et al. (2020). Effect of Sulfuric Acid Baking and Caustic Digestion on Enhancing
      the Recovery of Rare Earth Elements from a Refractory Ore. Minerals 10, 532.
    doi: 10.3390/min10060532
    locator: 'Table 4, 25 °C: Ce₂(SO₄)₃ 85.2, La₂(SO₄)₃ 20.9, Nd₂(SO₄)₃ 48.3, Y₂(SO₄)₃ 61.4 g/L; values
      attributed there to Das et al. (S3). Use the compound values outside parentheses, divided by anhydrous
      formula masses, not the elemental concentrations in parentheses.'
  S3:
    citation: 'Das, G., et al. (2019). Rare earth sulfates in aqueous systems: Thermodynamic modeling
      of binary and multicomponent systems over wide concentration and temperature ranges. Journal of
      Chemical Thermodynamics 131, 49–79.'
    doi: 10.1016/j.jct.2018.10.020
    locator: Thermodynamic treatment underlying the rare-earth sulfate values reproduced in S2; saturation
      solid phases can differ from the purchased hydrate.
  S4:
    citation: Tinjacá, D. A., et al. (2018). Solubility and Apparent Specific Volume of Sucrose in Some
      Aqueous Polyethylene Glycol Mixtures at 298.2 K. Pharmaceutical Sciences 24, 163–167.
    doi: 10.15171/PS.2018.24
    locator: 'Table 1, PEG mass fraction 0.00 (pure water): 2.688 mol/dm³ at 298.2 K.'
  S5:
    citation: Martins, M. J. N., et al. (2023). Solubility of different salts used in the control of the
      water activity of foods. Ciência e Agrotecnologia 47, e018722.
    doi: 10.1590/1413-7054202347018722
    locator: 'Table 2: KCl 25.401 ± 0.458 g/100 g solution at 293.15 K. The source also covers KI, NaCl,
      ammonium sulfate, KNO₃ and K₂SO₄, but those mass fractions alone are not molarities.'
  S6:
    citation: Bogacz, W., Al-Rashed, M. H., Lemanowicz, M., and Wójcik, J. (2016). A Simple Densimetric
      Method to Determine Saturation Temperature of Aqueous Potassium Chloride Solution. Journal of Solution
