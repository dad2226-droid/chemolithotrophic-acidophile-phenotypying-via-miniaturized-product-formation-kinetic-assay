schema_version: '1.0'
document_type: study_materials_inventory
title: Chemicals, materials, and equipment used in this study
reading_guide:
  scope: 58 tested additives, 4 additional attempted preparations excluded from additive tests, 22 medium/assay
    reagents or preparations, and 32 materials/equipment entries. Experimental batch assignments remain
    in family metadata.
  equipment_information: Product identities, available lots, applications, closures and device assignments
    are reported by the experimenter. Product lots are retained at inventory level; experiment-specific
    lot assignments are not inferred. Unknown product details remain null. Supplier specifications are
    distinguished from reported experimental settings.
  sources: Source paths are repository-root relative; node selects the source field or table entry where
    an experimental documentation source is available.
  table_fields: Display fields reproduce the nine-column Markdown chemical inventory. The source_number
    field contains the reported source/catalog identifier. Lot and source fields retain the supplied assignments;
    a source identifier is not automatically a verified catalog number.
  missing_values: null means unavailable or unestablished, never zero. A dash in concentration columns
    means not used as an additive; starred preparation targets are the explicit exception in [Stock] (M).
    NV marks a tested additive whose solubility has not yet been verified.
  bottle_scope: Listed bottles are not assigned to individual experiments or families; an identity match
    does not assign a bottle lot to every experiment.
  supplement_scope: MD-TMS is a purchased commercial supplement. TE Buffer was prepared as previously described.
    The preparation source is recorded under method_references.Dailey2026; reagent-batch assignments are unreported.
  reference_numbers: Chemical verification reference numbers resolve in chemicals_materials_equipment.md#references.
  stock_basis: Maximum 2x additive concentration by recorded additive_stock_pH across AF/AT/LF records;
    twice the concentration on the 200 uL basis, in salt formula units. Elemental Ga in the mixed experiment
    is divided by two. Full precision is retained in maximum_additive_stocks. Starred entries instead
    retain nominal preparation targets for compounds excluded from additive tests, stored in attempted_stock_preparations.
  concentration_provenance: N marks nominal concentrations in the Markdown stock column. Assignments follow
    biological_definitions.yaml concentration_conventions.nominal_reagents and the experimenter clarification
    of 2026-09-13. Sodium thiosulfate and potassium tetrathionate are nominal in all uses. Numerical stock
    maxima are retained; the remaining 47 additives retain an ICP-based working classification, including the experimenter-confirmed Ti and Zr stocks.
  solubility_basis: Seven verified numeric molarities plus sulfuric-acid miscibility; 50 additives remain
    not_verified. Water-solubility conditions are distinct from assay-stock pH. Reference IDs resolve
    below and in the Markdown solubility references. Literature references without verified numerical
    values remain leads.
  verification_labels: 'Lot: a certificate/index or inventory links the recorded batch to identity, not
    necessarily a numerical batch assay. Product: recorded identifier matches a supplier record. Identity:
    name/formula/CAS agree without bottle matching. Unresolved: chemical form or CAS unestablished. experimenter_reported:
    supplied bottle information, without an independent supplier catalog/batch match.'
  preparation_asterisk: Not visibly soluble at the indicated preparation concentration or after a further
    fourfold dilution in sulfuric acid at the target pH; excluded from additive tests. No numeric pH is
    assigned to these four preparations because it is not recorded.
  reagent_information: Bottle information is reported by the experimenter. CAS number grouping
    and zero-padding are normalized; supplied strings remain in the bottle records. Reported concentration
    values and their determination methods are specified for each record.
  stock_preparation_inputs:
    scope: '19 reported mass-and-final-volume pairs: 10 nominal additive stocks, the nominal thymol blue
      stock, three excluded preparations, and five stocks with an ICP-based working classification.
      One additional gallium stock has only a supplied formula mass.'
    location: preparation_record within each matching maximum_additive_stocks or attempted_stock_preparations
      entry; the thymol blue record is in experimental_definitions.yaml under reagent_preparations.thymol_blue.
    calculation: mass_g / formula_mass_for_nominal_calculation_g_per_mol / (final_volume_mL / 1000)
    formula_mass_reference: https://www.ciaaw.org/abridged-atomic-weights.htm
    nominal_basis: Calculations are uncorrected for purity. A factor of one is a nominal calculation convention,
      not a newly measured or experimenter-confirmed 100% reagent purity.
    volume_basis: Final solution volume is recorded separately from the nominal capacity of the preparation
      vessel. No missing mass or volume is inferred from concentration or vessel capacity.
    concentration_scope: Preparation calculations describe nominal compound concentrations. Reported
      stock concentrations, assay doses and their measured/nominal classifications are specified separately.
      Excluded-preparation targets do not establish dissolved concentrations.
    record_scope: A preparation entry is associated with the matching reagent and stock pH. It does not
      assign a bottle lot or shared physical stock batch to every experiment using that reagent.
