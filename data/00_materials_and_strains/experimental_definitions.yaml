schema_version: '1.0'
document_type: shared_experimental_definitions
reading_guide:
  scope: Shared source definitions used by experiment-family YAML references. Context-specific schemas,
    stock recipes, units and qualifications are retained.
  references: A sole $ref field names a relative YAML path and an optional JSON Pointer. Resolve it before
    using a field as a value.
  identities: Tables and study-wide inventories are in the adjacent materials, strains and media files.
    Experimental doses, acquisitions and culture assignments remain in the family files.
laboratory_water:
  grade: ultrapure
  purification_system: Milli-Q
  scope: All laboratory water uses; preparation-specific sterility requirements remain as documented.
  information_source: Experimenter clarification, 2026-09-15.
media_by_context:
