reference_methods:
  ICP_OES_elemental_analysis:
    method: ICP_OES
    manufacturer: Horiba
    model: Ultima Expert
    viewing_mode: radial
    emission_wavelength_unit: nm
    emission_wavelength_provenance: experimenter_reported
    emission_wavelengths_nm:
      Ag: 328.068
      Al: 167.018
      Cd: 214.441
      Ce: 416.561
      Co: 228.615
      Cr: 205.571
      Cu: 327.395
      Dy: 338.502
      Er: 369.265
      Eu: 412.97
      Fe: 259.94
      Ga: 417.204
      Gd: 342.247
      In: 230.606
      K: 766.49
      La: 379.478
      Li: 670.791
      Mg: 280.271
      Mn: 260.575
      Na: 588.995
      Nd: 386.333
      Ni: 230.3
      Pr: 417.939
      Sm: 359.26
      Tb: 334.942
      Ti: 334.941
      V: 309.311
      Y: 371.029
      Yb: 328.937
      Zn: 206.201
      Zr: 343.823
    default_sample_diluent:
      solute: HNO3
      concentration_percent: 2
      percent_basis: mass_per_volume
    sample_diluent_exceptions_by_element:
      Ti:
        solute: HCl
        concentration_percent: 2
        percent_basis: mass_per_volume
      Zr:
        solute: HCl
        concentration_percent: 2
        percent_basis: mass_per_volume
    concentration_processing:
      input: instrument_reported_elemental_mass_concentration
      ordered_steps:
      - subtract_the_corresponding_0_ppm_blank
      - multiply_by_the_total_analytical_dilution_factor
      - convert_elemental_mass_concentration_to_elemental_molar_concentration
      - divide_by_element_atoms_per_formula_unit_where_a_compound_basis_is_reported
      calculation_for_mg_per_L: (sample_mg_per_L - blank_mg_per_L) * analytical_dilution_factor / (1000 * elemental_molar_mass_g_per_mol)
      reported_values_already_corrected: true
      repeat_processing_on_deposited_concentrations: false
      analytical_dilution_is_distinct_from: stock_serial_dilution_and_medium_or_well_mixing
    reference_measurements:
      blank_concentration_ppm: 0
      one_ppm_reference:
        concentration_ppm: 1
        scope: each_reported_element
        availability: experimenter_confirmed
        role: reference_or_quality_control
  cell_pellet_preparation:
    description: Cell pellets were prepared in 50 mL tubes as previously described.
    method_reference_id: Dailey2026
    centrifuge: {$ref: "chemicals_materials_equipment.yaml#/materials_and_equipment/centrifuge_st_plus"}
    tube_capacity_mL: 50
    method_reference_doi: 10.64898/2026.08.27.747594
  pH_meter:
    method: potentiometric_pH_measurement
    manufacturer: Oakton
    model: pH 700
    meter: {$ref: "chemicals_materials_equipment.yaml#/materials_and_equipment/ph_meter"}
    electrode: {$ref: "chemicals_materials_equipment.yaml#/materials_and_equipment/ph_electrode"}
    instrument_type: benchtop_pH_meter
    calibration_standard_pH:
    - 1.68
    - 4.01
    - 7.0
    calibration_frequency: at_least_daily
  total_Fe_ICP_OES:
    analyte: total_Fe
    method: ICP_OES
    manufacturer: Horiba
    model: Ultima Expert
    viewing_mode: radial
    Fe_wavelength_nm: {$ref: "#/reference_methods/ICP_OES_elemental_analysis/emission_wavelengths_nm/Fe"}
    shared_elemental_method: {$ref: "#/reference_methods/ICP_OES_elemental_analysis"}
    sample_preparation_method_id: iron_reference_sample_preparation
    sample_diluent: {$ref: "#/reference_methods/ICP_OES_elemental_analysis/default_sample_diluent"}
    reference_standard:
      manufacturer: SPEX CertiPrep
      product: Iron Standards, CRM for AA and ICP
      grade: Assurance Grade
      standard_type: single_element
      element: Fe
      certified_concentration_ug_per_mL: 10000
      matrix: 5% HNO3
      packaging: plastic_bottle
      bottle_volume_mL: 125
    working_calibration_concentrations:
    - 0
    - 0.01
    - 0.05
    - 0.1
    - 0.5
    - 1
    - 5
    - 10
    - 25
    working_calibration_concentration_unit: ppm
    quality_control:
      blank_subtraction: true
      spike_recovery_acceptance_percent:
      - 90
      - 110
      independent_check_standard_acceptance_percent:
      - 85
      - 115
      randomized_replicate_measurements: true
      maximum_experimental_samples_between_QC_checks: 20
    reported_quantity: total_Fe_concentration_in_ferric_stock_before_optical_well_preparation
    reported_values_are_dilution_adjusted: true
    repeat_blank_or_instrument_dilution_correction_on_reported_values: false
    reported_concentrations_are_dilution_adjusted: true
  iron_reference_sample_preparation:
    sample_volume_uL: 1000
    centrifuge: {$ref: "chemicals_materials_equipment.yaml#/materials_and_equipment/centrifuge"}
    microcentrifuge_tube: {$ref: "chemicals_materials_equipment.yaml#/materials_and_equipment/microcentrifuge_tubes"}
    steps:
    - step: 1
      action: centrifuge
      relative_centrifugal_force_x_g: 3000
      duration_s: 10
    - step: 2
      action: transfer_supernatant_to_new_microcentrifuge_tube
      transferred_volume_uL: 750
    - step: 3
      action: centrifuge
      relative_centrifugal_force_x_g: 17000
      duration_s: 60
    - step: 4
      action: dilute_supernatant_for_ICP_OES
      reported_concentration_basis: Dilution-adjusted stock concentration; do not apply an additional
        analytical dilution correction.
    sample_volume_is_not_optical_well_volume: true
