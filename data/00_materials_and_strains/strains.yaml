schema_version: '1.0'
document_type: study_strain_inventory
title: Strains used in this study
reading_guide:
  sources: Paths are repository-root relative.
  culture_collections: ATCC and DSM identifiers are strain designations; acquisition lot or date is not
    established by those identifiers.
  abiotic_controls: Ab denotes an abiotic control and is not a strain.
  starter_identity: Strain identity does not merge culture batches. Keep batch_id, inoculum_culture_ID,
    physical vessel and replicate identities in their family metadata.
  LF_cohorts: Unknown-age original LF microplate starters and their qualitative follow-up are distinct
    from the freshly thawed test-tube starters.
