# Test-tube measurements, conditions and methods. All identifiers are defined here.
# Column names and capitalization match test_tube_measurements.csv.
schema_version: '1.0'
dataset_id: test_tube_validation
chemical_reagents_file: ../00_materials_and_strains/chemical_reagents.yaml
title: Acidophile activity in iron, elemental-sulfur and tetrathionate test-tube cultures
files:
  measurements: test_tube_measurements.csv
  readme: README.md
record_definition: One row per physical tube and sampling event. Event 0 explicitly contains shared initial
  reference assignments rather than independent tube measurements.
counts:
  conditions: 32
  tubes: 96
  biotic_tubes: 63
  abiotic_tubes: 33
  independent_starter_cultures: 15
  time_course_rows: 1074
  shared_initial_reference_rows: 96
  distinct_initial_reference_assignments: 21
  total_csv_rows: 1170
  measured_pH_values: 749
  measured_orp_values: 323
  endpoint_rfu_values_reported: 96
  endpoint_rfu_values_not_recorded: 0
organisms:
  AF:
    name: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AF/scientific_name"}
    strain: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AF/strain"}
  AT:
    name: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AT/scientific_name"}
    strain: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AT/strain"}
  LF:
    name: {$ref: "../00_materials_and_strains/strains.yaml#/strains/LF/scientific_name"}
    strain: {$ref: "../00_materials_and_strains/strains.yaml#/strains/LF/strain"}
  AFur:
    name: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AFur/scientific_name"}
    strain: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AFur/strain"}
  AC:
    name: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AC/scientific_name"}
    strain: {$ref: "../00_materials_and_strains/strains.yaml#/strains/AC/strain"}
abiotic_code:
  code: Ab
  description: Cell-free control with matching basal-salt addition.
common_conditions:
  tube_capacity_mL: {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/material_values/tube_capacity_ml_14"}
  tube_material: {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/material_values/tube_material_polystyrene"}
  tube_product: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/tube_14ml"}
  shaker: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/culture_shaker"}
  tube_mounting: Tubes were held at a 60-degree angle in mounted wire racks.
  closure: {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/material_values/closure_cap"}
  prepared_medium_volume_mL: 6
  inoculum_volume_uL: 20
  volume_interpretation: The 20 uL inoculum was added to 6 mL prepared medium. Listed nominal 1x concentrations
    describe the prepared medium before the small inoculum addition.
  initial_target_OD600: 0.003
  shaking_speed_rpm: 150
  start_datetime: '2026-08-04T18:15:20'
  incubation_temperature: 30 or 37 degrees Celsius, specified for every condition.
  evaporation_compensation: Restore evaporated volume with sterile ultrapure Milli-Q water before pH and ORP measurements.
  measurement_location: pH and ORP were measured directly in the culture tubes.
  abiotic_addition: Matching cell-free basal-salt solution in place of inoculum.
  cell_pellet_preparation: {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/reference_methods/cell_pellet_preparation"}
replication:
  experimental_unit: physical tube
  replicates_per_condition: 3
  starter_preparation: Freshly thawed cells; three independent starter cultures per organism, washed and
    normalized with no growth-medium carryover.
  culture_id_rule: TT_<organism_code>_<replicate>. The same identifier denotes the same starter culture
    across treatments.
  culture_ids:
    AF:
    - TT_AF_1
    - TT_AF_2
    - TT_AF_3
    AT:
    - TT_AT_1
    - TT_AT_2
    - TT_AT_3
    LF:
    - TT_LF_1
    - TT_LF_2
    - TT_LF_3
    AFur:
    - TT_AFur_1
    - TT_AFur_2
    - TT_AFur_3
    AC:
    - TT_AC_1
    - TT_AC_2
    - TT_AC_3
  analysis_pairing: Shared starter identities are retained; paired treatment analyses are not required.
  repeated_measurements: Successive sampling events observe the same physical tubes.
  abiotic_identity: Abiotic tubes have no inoculum culture; their replicate numbers do not identify a
    cell culture.
  microplate_relationship: These freshly thawed starter cultures are distinct from the unknown-age LF
    microplate starters described in lf_starter_followup.
preparation:
  mixing: Mix the 2x medium and 2x treatment solution in equal volumes to obtain the listed nominal 1x
    medium and treatment concentrations.
  medium_volume_fraction: 0.5
  treatment_solution_volume_fraction: 0.5
  medium_stock_strength: 2
  treatment_stock_strength: 2
  other_solution_target_pH: 1.8
  pH_interpretation: Preparation pH values describe the component solutions. Actual mixed-medium initial
    pH is retained in the shared initial references; later pH is recorded in the measurement rows.
  concentration_basis: Nominal prepared-medium concentrations. Stock and final concentrations are specified
    separately.
media:
  {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/media_by_context/test_tube_validation"}
treatments:
  no_added_metal:
    description: No additional Ga or In treatment; the defined medium ingredients remain present.
    Ga_final_mM: 0
    In_final_mM: 0
  Ga_100mM:
    preparation_reagent_id: gallium_sulfate
    ion: Ga(III)
    stock_concentration_mM: 200
    stock_volume_fraction: 0.5
    final_concentration_mM: 100
  In_10mM:
    preparation_reagent_id: indium_sulfate
    ion: In(III)
    stock_concentration_mM: 20
    stock_volume_fraction: 0.5
    final_concentration_mM: 10
references:
  Dailey2026:
    citation: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/method_references/Dailey2026/citation"}
    citation_style: ACS
    bibliography: README.md#references
measurement_methods:
  pH:
    instrument: {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/material_values/instrument_oakton_ph_700_benchtop_meter"}
    meter: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/ph_meter"}
    electrode: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/ph_electrode"}
    calibration_standards_pH:
    - 1.68
    - 4.01
    - 7.0
    calibration_frequency: At least daily
  orp:
    unit: mV
    meter: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/orp_meter"}
    electrode: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/orp_electrode"}
    reference_electrode: Ag/AgCl
    reference_electrolyte: 3 M KCl
    reported_quantity: Recorded electrode potential; no conversion to a standard hydrogen-electrode scale
      is applied.
  fluorescence:
    fraction: planktonic
    plate_product: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/fluorescence_plate_3915"}
    reported_unit: RFU
    background_corrected: true
    background_blank: TE Buffer
    blank_subtracted_before_deposition: true
    method_description: SYBR Green I dsDNA fluorescence was measured as previously described.
    method_reference_id: Dailey2026
    method_reference_location: Supporting Information, protocol for cell density normalization and quantification.
    instrument: {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/material_values/instrument_molecular_devices_spectramax_m2"}
    sampling_scope: endpoint
    data_status: All 96 numerical endpoint measurements are reported, including the 30 brown elemental-sulfur
      endpoints. Endpoint fluorescence_status is reported; negative numerical readings are retained.
    method: SYBR Green I dsDNA fluorescence
    interpretation: The reported RFU values already have the TE Buffer blank subtracted. Do not subtract
      the blank again or apply an OD600 baseline.
    coverage:
    - timing_block_ID: HH
      reported: 36
      not_recorded: 0
    - timing_block_ID: brown_sulfur
      reported: 30
      not_recorded: 0
    - timing_block_ID: tetrathionate
      reported: 30
      not_recorded: 0
timing:
  datetime_format: YYYY-MM-DDTHH:MM:SS, with fractional seconds for interpolated times when needed.
  time_zone: unspecified
  elapsed_time_unit: d
  seconds_per_day: 86400
  summary_group:
  - timing_block_ID
  - sampling_event
  summary_scope: All tube times in that block and sampling event, across treatments, organisms and temperatures;
    do not calculate separate three-replicate time summaries.
  elapsed_time_expression: (tube_datetime - start_datetime) / one day
  mean_expression: sum(elapsed_time_d) / n
  sd_expression: sqrt(sum((elapsed_time_d - mean)^2) / (n - 1))
  initial_time: Event 0 is assigned time zero, with time_average_d and time_sd_d both 0. No independent
    tube measurements were taken for these initial reference assignments.
  interpolation:
    timing_block_ID: HH
    sampling_event: 6
    first_tube_id: GT-S2-1
    first_datetime: '2026-08-08T06:23:10'
    last_tube_id: GT-S2-36
    last_datetime: '2026-08-08T07:34:15'
    interpolated_tube_ids:
    - GT-S2-2
    - GT-S2-3
    - GT-S2-4
    - GT-S2-5
    - GT-S2-6
    - GT-S2-7
    - GT-S2-8
    - GT-S2-9
    - GT-S2-10
    - GT-S2-11
    - GT-S2-12
    - GT-S2-13
    - GT-S2-14
    - GT-S2-15
    - GT-S2-16
    - GT-S2-17
    - GT-S2-18
    - GT-S2-19
    - GT-S2-20
    - GT-S2-21
    - GT-S2-22
    - GT-S2-23
    - GT-S2-24
    - GT-S2-25
    - GT-S2-26
    - GT-S2-27
    - GT-S2-28
    - GT-S2-29
    - GT-S2-30
    - GT-S2-31
    - GT-S2-32
    - GT-S2-33
    - GT-S2-34
    - GT-S2-35
    rule: Assign equal time spacing in ascending tube-number order between the two recorded endpoints.
    expression: t(k) = t(first) + (k - 1) * (t(last) - t(first)) / 35, for tube numbers k = 2 through
      35.
    summary_interpretation: This block/event mean and SD use 2 recorded times plus 34 interpolated times;
      the SD partly reflects the interpolation assumption.
    recorded_tube_times: 2
    interpolated_tube_times: 34
