lf_starter_followup:
  observation_id: LF_starter_HH_followup
  organism_code: LF
  record_type: recorded_qualitative_observation
  record_scope: Triplicate group
  starter_identity: The original unknown-age starter cultures used in the LF microplate experiments.
  distinct_from_test_tube_cultures: true
  replicate_count: 3
  medium_ID: HH
  treatment_ID: no_added_metal
  incubation_temperature_C: 37
  shaking_speed_rpm: 150
  start_relation: Started on the day the LF microplate experiments ended, after the plate experiments
    appeared inactive.
  incubation_duration_d: 14
  comparator: Abiotic HH controls
  readout: Visual red coloration associated with iron biooxidation
  outcome: The starter-inoculated tubes did not become more red than the abiotic controls after 14 days.
data_format:
  encoding: UTF-8
  delimiter: ','
  header_rows: 1
  decimal_separator: .
  missing_value: NA
  missing_value_interpretation: No numerical measurement or no applicable value; never zero. FALSE, NA
    and unrecorded measurements are all represented as NA.
  unique_key:
  - tube_ID
  - sampling_event
  sort_order:
  - timing_block_ID (HH, brown_sulfur, tetrathionate)
  - sampling_event
  - tube numerical suffix
  precision: Supplied numerical precision is retained. Fractional seconds on interpolated clocks do not
    imply measurement precision.
columns:
- name: tube_ID
  type: string
  description: Physical tube identifier, unchanged across sampling events.
- name: condition_ID
  type: string
  description: Condition identifier defined under conditions.
- name: timing_block_ID
  type: string
  description: Block used to calculate sampling-time means and SDs; defined under timing_blocks.
- name: organism_code
  type: string
  description: Organism identifier defined under organisms; Ab denotes an abiotic control.
- name: replicate
  type: integer
  description: Replicate number 1, 2 or 3 within a condition.
- name: inoculum_culture_ID
  type: string
  description: Shared starter-culture identifier; NA for abiotic tubes.
- name: medium_ID
  type: string
  description: Prepared medium defined under media.
- name: treatment_ID
  type: string
  description: Additional metal treatment defined under treatments.
- name: incubation_temperature_C
  type: number
  description: Tube incubation temperature in degrees Celsius.
- name: sampling_event
  type: integer
  description: Sampling sequence within the timing block. Event 0 contains assigned initial references.
- name: record_role
  type: string
  description: shared_initial_reference, measurement or endpoint. Endpoint is the final time-course event
    in that block.
- name: initial_reference_ID
  type: string
  description: Shared initial-reference identity defined under shared_initial_references.values; NA for
    measured time-course events. Repeated identities are one reference assignment, not new measurements.
- name: time_average_d
  type: number
  description: Arithmetic mean elapsed time in days across all tubes in this block and event; use as the
    common sampling time.
- name: time_sd_d
  type: number
  description: Sample SD of elapsed times within this block and event, with denominator n - 1. Describes
    timing spread, not biological variability or an SE.
- name: tube_datetime
  type: string
  description: ISO 8601 local date and clock time, without a timezone offset. Retained for reconstructing
    block timing summaries.
- name: datetime_basis
  type: string
  description: recorded, interpolated or assigned_start. Describes this tube time, not the whole block
    summary.
- name: pH
  type: number
  description: Recorded pH at measurement/endpoint rows; assigned shared initial pH at event 0. NA means
    no numeric value.
- name: orp_mV
  type: number
  description: Recorded oxidation-reduction potential in mV at measurement/endpoint rows; assigned shared
    initial ORP at event 0. NA means no numeric value.
- name: planktonic_background_corrected_rfu
  type: number
  description: Endpoint planktonic SYBR Green fluorescence in RFU after TE Buffer blank subtraction.
    NA means no available or applicable numerical value; interpret with fluorescence_status.
- name: fluorescence_status
  type: string
  description: 'reported: a numerical endpoint RFU is present; not_recorded: no numerical endpoint fluorescence
    measurement is available; not_scheduled: this is not an endpoint fluorescence event.'
  allowed_values:
  - reported
  - not_recorded
  - not_scheduled
- name: operator_initials
  type: string
  description: Recorded operator initials. Event 0 identifies the preparation entry.
