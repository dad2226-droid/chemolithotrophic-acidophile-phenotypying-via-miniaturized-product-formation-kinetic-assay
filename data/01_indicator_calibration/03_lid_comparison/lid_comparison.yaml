curation_notes:
  - The workbook is one source file containing 12 measured sheets. Each sheet is one acquisition; the six wavelength
    times are retained individually.
  - Lid and no-lid measurements are paired by confirmed physical plate and well, not treated as independent plates.
  - The experimenter confirmed that the ferric lid-comparison plates are distinct from the final ferric calibration
    and storage plates. Matching numbered labels across these experiments do not identify the same physical plates.
  - The ferric lid experiment retains one recorded standard preparation and the shared recorded reference values;
    its stock-preparation relationship to the final ferric series is not independently documented.
  - The programmed plate profile records instrument settings. The physical_plates section identifies the material
    of each plate.
  - All Fe calibration concentrations use measured total Fe except records explicitly identified as Fe_II titrations.
    Reference values are on the 200 uL standard basis; final-well volume adjustment is condition-specific.
