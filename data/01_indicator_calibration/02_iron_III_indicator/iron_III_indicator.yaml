experiments:
  iron_configuration_0.001M_H2SO4_23_C_UV:
    title: Iron indicator in 0.001 M sulfuric acid configuration at 23 C, UV plate
    preparation:
      medium: H2SO4
      standard_solute: iron(III) sulfate
      declared_h2so4_M: 0.001
      plate_type: UV_transparent
      condition_temperature_C: 23
      temperature_description: Experimental condition temperature; actual reader temperature is recorded separately
        for each export.
      gas_permeable_membrane: null
      membrane_status: absent
      nominal_dyed_well_thymol_blue_uM: 10
      thymol_blue_stock_uM: 200
      calculated_dyed_well_thymol_blue_uM: 9.523809523809524
      dye_added_to_dyed_wells_uL: 10
      reference_standard_volume_uL: 200
      final_well_volume_uL_by_condition:
        no_thymol_blue: 200
        thymol_blue: 210
      declared_h2so4_basis: 200_uL_standard
      measurement_lid_state: absent
      dye_stock_protocol_id: thymol_blue_stock
      calculated_dye_concentration_is_not_a_measurement: true
      plate_manufacturer: {$ref: "../../00_materials_and_strains/experimental_definitions.yaml#/material_values/manufacturer_corning"}
      plate_catalog_number: {$ref: "../../00_materials_and_strains/experimental_definitions.yaml#/material_values/catalog_number_3635"}
    replication:
      numbered_runs: 3
      technical_wells_per_condition_per_run: 4
      independent_standard_preparations: 3
      physical_plate_identity_across_conditions: same_physical_plates_reused
      standard_preparations_made_on_separate_days: true
      standard_solutions_freshly_prepared_for_each_run: true
      independent_preparation_count_scope: Within this standard series; repeated acquisitions do not increase the
        count.
      physical_plates_in_this_experiment: 3
    timing:
      date_last_saved_interpretation: Timestamp preserved from the reader export; not relabelled as acquisition
        start.
      initial_and_overnight_link: The same physical plates were read before and after the 23 C overnight incubation.
      initial_incubation_protocol_id: initial_plate_incubation
      incubation_protocol_id: configuration_temperature_sequence
      same_plate_reused_across_incubation_steps: true
    well_layout_note: Rows A-D are undyed; rows E-H contain thymol blue. Both halves use the same concentration
      positions.
    calibration_quantities:
      - iron_standard_concentration
      - pH_where_available
    reference_sets_by_run:
      - run_number: 1
        reference_set_id: iron_configuration_0.001M_run1
      - run_number: 2
        reference_set_id: iron_configuration_0.001M_run2
      - run_number: 3
        reference_set_id: iron_configuration_0.001M_run3
    physical_plate_ids:
      - iron_configuration_0.001M_UV_run1
      - iron_configuration_0.001M_UV_run2
      - iron_configuration_0.001M_UV_run3
