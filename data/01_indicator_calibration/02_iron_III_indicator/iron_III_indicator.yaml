preparation_protocols:
  thymol_blue_stock:
    {$ref: "../../00_materials_and_strains/experimental_definitions.yaml#/reagent_preparations/thymol_blue_stock"}
  initial_plate_incubation:
    temperature_C: 23
    duration_min: 30
    measurement_lid_state: absent
incubation_protocols:
  configuration_temperature_sequence:
    same_physical_plates_at_every_step: true
    steps:
      - step_id: initial_23_C
        order: 1
        temperature_C: 23
        duration_min: 30
        gas_exchange_membrane_present: false
      - step_id: incubation_4_C
        order: 2
        temperature_C: 4
        incubator: {$ref: "../../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/calibration_incubator_4c"}
        duration_min: 120
        gas_exchange_membrane_present: false
      - step_id: incubation_30_C
        order: 3
        temperature_C: 30
        duration_min: 120
        gas_exchange_membrane_present: false
      - step_id: incubation_75_C
        order: 4
        temperature_C: 75
        duration_min: 120
        gas_exchange_membrane_present: false
      - step_id: overnight_23_C
        order: 5
        temperature_C: 23
        duration_description: overnight
        exact_duration_min: null
        storage_seal: Parafilm
        seal_applied: before_this_incubation
        gas_exchange_membrane_present: false
      - step_id: membrane_23_C
        order: 6
        temperature_C: 23
        action: Attach Breathe-Easy gas-exchange membrane after the preceding unmembraned reading and acquire another
          reading.
        gas_exchange_membrane_present: true
        membrane: {$ref: "../../00_materials_and_strains/experimental_definitions.yaml#/material_values/membrane_breathe_easy"}
    measurement_timing: Read immediately after each incubation before starting the next incubation; the membrane
      reading follows the final unmembraned reading.
    measurement_lid_state: absent
    temperature_basis: Incubation temperatures; actual reader temperatures remain recorded separately for each acquisition.
    duration_basis: Prescribed incubation durations, not exact elapsed times reconstructed from file timestamps.
