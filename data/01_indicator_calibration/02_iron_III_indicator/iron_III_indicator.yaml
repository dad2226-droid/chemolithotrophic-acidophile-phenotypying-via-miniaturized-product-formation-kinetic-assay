interpretation_notes:
  - Dyed and undyed wells in the same export are described together in its reference set; the export appears only
    once.
  - The 0.001 M acid configurations use the explicitly listed 0.001 M source exports.
  - Rows A-D are undyed and rows E-H contain thymol blue in the configuration and final iron calibration plates.
  - Exact filenames in acquisitions identify the included source exports.
  - The unavailable pH value for 0.001 M acid, run 1, column 4 is null; it is not numerical zero.
  - Final ferric and ferrous references use measured total Fe from reference_measurements.csv.
  - All observations are abiotic absorbance measurements. No measurements are excluded by this metadata.
  - Fe concentrations use measured total Fe except records explicitly identified as Fe_II titrations. Values are
    on the 200 uL standard basis; final-well volume adjustment is condition-specific.
  - Fe calibration arrays are expressed in M. Stock-specific measured differences, including the 1.02 M maximum,
    are retained. The reference CSV retains its supplied numerical precision.
  - Column 2 of every configuration reference set and column 3 of iron_configuration_0.001M_run3 contain author-confirmed
    concentrations, documented in values_by_column.
  - Within each acid series and preparation run, the UV and non-UV plates used the same standard series; each physical
    plate was reused across the configuration sequence. Dye states occupy different row halves of the same plate.
reference_measurements:
  title: Reported total-Fe reference concentrations and Fe(II) measurements before the final well addition
  data_filename: reference_measurements.csv
  csv_format:
    encoding: UTF-8; an optional leading byte-order mark is permitted
    python_read_encoding: utf-8-sig
    delimiter: ','
    decimal_separator: .
    header_present: true
    column_names_are_case_sensitive: true
    column_order:
      - measurement_ID
      - reference_sample_ID
      - series_ID
      - preparation_salt
      - nominal_H2SO4_concentration_M
      - plate_column
      - analyte
      - reference_replicate
      - measured_concentration_M
      - reference_volume_uL
      - optical_final_volume_uL
      - concentration_basis
    not_applicable_tokens:
      reference_replicate: [NA]
  table:
    row_definition: one reported analyte concentration measured for the identified reference sample
    expected_rows: 144
    total_Fe_rows: 36
    Fe_II_rows: 108
    reference_samples: 36
    concentration_unit: mol_per_litre
    reference_solution_volume_uL: 200
    concentration_basis: before_final_addition
    optical_final_well_volume_uL_by_condition:
      no_thymol_blue: 200
      thymol_blue: 210
    csv_optical_final_volume_applies_to: thymol_blue_wells_only
  columns:
    measurement_ID: Unique identifier for one reported analyte-concentration record; use as the record key.
    reference_sample_ID: Identifier for one reference series and concentration position; not an optical plate identifier.
    series_ID: 'Reference series: ferric, ferrous_1M or ferrous_0.001M. Match this exact column name and value when
      selecting a calibration series.'
    preparation_salt: Iron-source salt used for preparation. This does not change the analyte concentration to salt
      formula units.
    nominal_H2SO4_concentration_M: Nominal sulfuric-acid concentration in the 200 uL standard, in mol per litre;
      not an independently measured final-well value.
    plate_column: Plate concentration position, numbered 1 through 12 in the listed order.
    analyte: Exact label total_Fe for total iron or Fe_II for iron(II). Both concentrations are expressed on an
      Fe basis.
    reference_replicate: 1, 2 or 3 for an Fe_II reference replicate; NA means not applicable for the single total_Fe
      value at that reference-sample position. These numbers are not optical plate numbers.
    measured_concentration_M: Reported analyte concentration on the 200 uL standard basis, in mol per litre. Analytical
      preparation dilutions are already accounted for; final optical-well dilution and Fe(III) subtraction have
      not been applied. Each reference concentration level was measured; see reference_concentration_provenance.
      Reuse of a reference for several optical wells does not constitute additional chemical measurements.
    reference_volume_uL: 'Reference-solution volume in microlitres before the final addition: 200.'
    optical_final_volume_uL: 'Final volume of the dyed optical wells: 210 uL. This column does not describe undyed
      wells, which contain 200 uL and require no final-volume dilution factor.'
    concentration_basis: before_final_addition identifies the concentration basis for every reported value.
  column_types:
    measurement_ID: string
    reference_sample_ID: string
    series_ID: string
    preparation_salt: string
    nominal_H2SO4_concentration_M: number
    plate_column: integer
    analyte: string
    reference_replicate: integer or NA
    measured_concentration_M: number
    reference_volume_uL: number
    optical_final_volume_uL: number
    concentration_basis: string
  series:
    - series_ID: ferric
      preparation_salt: Fe2(SO4)3
      nominal_H2SO4_concentration_M: 1.0
      reference_samples: 12
      total_Fe_rows: 12
      Fe_II_rows: 36
    - series_ID: ferrous_1M
      preparation_salt: FeSO4
      nominal_H2SO4_concentration_M: 1.0
      reference_samples: 12
      total_Fe_rows: 12
      Fe_II_rows: 36
    - series_ID: ferrous_0.001M
      preparation_salt: FeSO4
      nominal_H2SO4_concentration_M: 0.001
      reference_samples: 12
      total_Fe_rows: 12
      Fe_II_rows: 36
  interpretation:
    total_Fe_is_not_ferric_sulfate_formula_units: true
    multiply_total_Fe_by_two: false
    reference_replicates_paired_to_optical_plates: false
    FeII_method: ferroin_cerimetry
    total_Fe_method: ICP_OES
    low_nonzero_FeII_readings: preserve as reported
    numeric_values_preserved_as_reported: true
    derived_FeIII_differences_included: false
    negative_total_Fe_minus_FeII_differences: possible; preserve original measurements without clipping
    csv_has_volume_correction_applied: false
    total_Fe_method_id: total_Fe_ICP_OES
    FeII_method_id: FeII_titration
    reference_csv_values_retained_at_supplied_precision: true
    stored_decimal_places_do_not_establish_independent_measurement_precision: true
reference_concentration_documentation:
  status: author_confirmed
  values_by_column_are_reference_values: true
  records:
    - reference_set_ids:
        - iron_configuration_0.001M_run1
        - iron_configuration_0.001M_run2
        - iron_configuration_0.001M_run3
        - iron_configuration_0.01M_run1
