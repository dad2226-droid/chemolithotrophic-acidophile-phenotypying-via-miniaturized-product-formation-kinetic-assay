curation_notes:
  - The pH standard spectra and storage experiment includes 45 endpoint exports and three spectra from three
    non-UV-transparent plates, with both dye states.
  - The initial UV 20 uM dye-stock experiment has a nominal final dye concentration of 1 uM; the calculated value
    is stated in its preparation metadata.
  - Exact source filenames retain their capitalization. No filenames are reconstructed from factor labels.
  - All observations are abiotic absorbance measurements. No measurements are excluded by this metadata.
  - The three initial reference pH grids differ and are reused across readings of the corresponding preparation
    run. pH was not remeasured at every optical acquisition.
  - The 20 uM and 200 uM dye-stock experiments used separate physical plates. The 200 uM UV and non-UV plates were
    reused across the configuration sequence.
