dilution_series:
  acid:
    level_ids: [level_01, level_02, level_03, level_04, level_05, level_06, level_07, level_08]
    plate_rows: [A, B, C, D, E, F, G, H]
    relative_stock_fractions_by_row: [1, 0.5, 0.25, 0.125, 0.0625, 0.03125, 0.015625, 0]
    starting_H2SO4_nominal_M: 1
    dilution_solvent: water
    stock_H2SO4_nominal_M_by_row: [1, 0.5, 0.25, 0.125, 0.0625, 0.03125, 0.015625, 0]
    nominal_added_H2SO4_M_in_200_uL_by_row: [0.5, 0.25, 0.125, 0.0625, 0.03125, 0.015625, 0.0078125, 0.0]
    stock_pH_reference_set_id: media_ph_acid_stock
    calculation: stock_H2SO4_nominal_M * calibration_solution_volume_uL / final_well_volume_uL
    quantity_scope: Nominal added H2SO4 only; excludes acid already in the medium and is not a measured H+ concentration.
    row_H: Water in place of the acid dilution; no added H2SO4 from this series.
  ferric:
    level_ids: [level_01, level_02, level_03, level_04, level_05, level_06, level_07, level_08]
    plate_rows: [A, B, C, D, E, F, G, H]
    relative_stock_fractions_by_row: [1, 0.5, 0.25, 0.125, 0.0625, 0.03125, 0.015625, 0]
    stock_reference_id: media_ferric_stock_Fe
    stock_reagent: iron(III) sulfate hydrate
    nominal_starting_Fe_M: 0.2
    dilution_solvent: 1 M H2SO4
    derived_added_Fe_M_in_200_uL_by_row: [0.1047, 0.05235, 0.026175, 0.0130875, 0.00654375, 0.003271875, 0.0016359375,
      0.0]
    added_H2SO4_nominal_M_in_200_uL: 0.5
    calculation: reference value in M * relative_stock_fraction * 100 uL / 200 uL
    quantity_scope: Added Fe calculated from measured total Fe in the ferric stock; excludes background Fe in the
      medium.
    oxidation_state_assignment: Assigned as added Fe(III) from the ferric reagent identity. ICP-OES itself does not
      distinguish oxidation state.
    whole_mixture_Fe_speciation_reference_available: false
    row_H: 1 M H2SO4 without ferric addition; not an iron-free medium blank.
