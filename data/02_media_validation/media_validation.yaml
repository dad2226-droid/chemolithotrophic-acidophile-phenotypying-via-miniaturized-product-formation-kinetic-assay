# Media-validation metadata and well assignments
# Units and reference-table fields are defined within this file.

metadata_format: media_validation
format_version: 1
title: Endpoint pH and iron(III) indicator validation in acidophile media
reading_guide:
  purpose: Experimental metadata, well maps and reference associations for twelve abiotic endpoint plates.
  experiments: Four experimental families sharing calibration stocks. Each family has three physical plate replicates.
  media: Medium identities, recipes, stock strengths and preparation pH.
  groups: One medium and dye condition occupying a three-column block on three plates. Rows A-H identify the dilution
    levels.
  acquisitions: One measured export per physical plate; source_filename is the exact included filename.
  reference_sets: Ordered identifiers linking dilution levels to the accompanying reference_measurements.csv.
  reference_sharing: Each medium has separately measured pH references. Equal numeric values across media remain separate
    records. Within one medium, a before-dye reference is associated with the matched dye conditions and replicate
    plates.
  unknown_values: null means the information is not established or is inapplicable, as explained by the accompanying
    field; it never means zero.
  editing: Use spaces for indentation, true or false for yes/no fields, and preserve identifier strings and ordered
    lists.
  units:
    M: mol per litre
    uM: micromol per litre
    uL: microlitre
    g_per_L: gram per litre
    mL_per_L: millilitre per litre
    nm: nanometre
    C: degrees Celsius
    pH: dimensionless
    AU: absorbance units
study_design:
  organisms_present: false
  measurement_schedule: single_endpoint
  physical_plate_count: 12
  condition_group_count: 13
  dilution_levels_per_group: 8
  technical_wells_per_level_per_plate: 3
  plate_replicates_per_experiment: 3
  independent_preparations_per_experiment: 1
  independent_biological_replicates: 0
  measured_well_count: 936
  measured_absorbance_count: 5616
  preparation_sharing_between_experiments: same_calibration_stocks
  replicate_unit: physical_plate
  shared_stock_set_id: media_calibration_stocks
  plate_rows: [A, B, C, D, E, F, G, H]
preparation:
  medium_stock_strength_relative_to_standard_recipe: 2
  medium_volume_uL: 100
  calibration_solution_volume_uL: 100
  well_preparations:
    no_dye:
      dye_added_volume_uL: 0
      final_well_volume_uL: 200
      thymol_blue_concentration_uM: 0
    with_dye:
      dye_added_volume_uL: 10
      dye_stock_concentration_uM: 200
      final_well_volume_uL: 210
      nominal_thymol_blue_concentration_uM: 10
      calculated_thymol_blue_concentration_uM: 9.523809523809524
      calculation: 200 uM * 10 uL / 210 uL
  dye_addition_scope: Dye-containing pH groups only. Every ferric-addition group is undyed.
  medium_strength_calculation: 2 * medium_volume_uL / final_well_volume_uL
  medium_strength_in_no_dye_wells: 1
  medium_strength_in_with_dye_wells: 0.9523809523809523
  concentration_basis: Standard-medium recipes describe the 200 uL medium-plus-standard mixture. Extra dye solution
    dilutes medium components by 200/210 in dyed wells.
  sulfur_suspension_mixing: Aggressively vortex the 2x sulfur-containing medium before dispensing.
  vortex_mixer: {$ref: "../00_materials_and_strains/chemicals_materials_equipment.yaml#/materials_and_equipment/vortex_mixer"}
  temperature_before_reading_C: 23
  incubation_before_reading_minutes: 30
  incubation_temperature_description: approximately 23 C
stock_sets:
  media_calibration_stocks:
    description: Common calibration stocks used across all four experimental families; replicate plates were dispensed
      from these stocks.
    acid_stock:
      chemical: H2SO4
      nominal_concentration_M: 1
    ferric_stock:
      reference_id: media_ferric_stock_Fe
      solvent: 1 M H2SO4
    thymol_blue_stock:
      concentration_uM: 200
reference_methods:
  pH_meter:
    {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/reference_methods/pH_meter"}
  total_Fe_ICP_OES:
    {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/reference_methods/total_Fe_ICP_OES"}
  iron_reference_sample_preparation:
    {$ref: "../00_materials_and_strains/experimental_definitions.yaml#/reference_methods/iron_reference_sample_preparation"}
reference_table:
  filename: reference_measurements.csv
  encoding: UTF-8
  delimiter: ','
  primary_key: reference_ID
  record_count: 49
  record_definition: One measured reference value. Different media have separate pH records even when their values
    are numerically identical; repeated use within a medium does not create additional reference measurements.
  column_names_are_case_sensitive: true
  missing_value: NA
  missing_value_meaning: NA in level_ID and plate_row identifies an inapplicable field for the ferric-stock reference.
  missing_value_handling: Preserve NA as inapplicable; never replace it with numeric zero.
  columns:
    reference_ID: Unique reference value identifier; exact lookup key.
    reference_set_ID: Identifier for an ordered pH series or the ferric-stock reference.
    level_ID: Dilution level_01 to level_08; NA for the undiluted ferric-stock reference.
    plate_row: A-H for the associated dilution; NA for the ferric-stock reference.
    quantity: pH or total_Fe. ICP-OES measures total Fe in the ferric stock.
    value: Numeric measured reference value at the precision provided in this CSV; Fe is represented in M.
      Do not infer measurement precision from the presence or absence of trailing zeros.
    unit: pH or M, as defined in reading_guide.units.
    measurement_basis: Which solution was measured; stock and final-mixture values are distinct.
    method_ID: Exact key in reference_methods.
  Fe_unit_conversion: The reported stock value of 209.4 mM is represented as 0.2094 M; no additional dilution correction
    is applied to that reported result.
  final_mixture_pH_scope: pH was measured separately for each medium and dilution level before dye addition. These
    medium-specific measurements are associated with both dye conditions and the three replicate plates. No post-dye
    pH measurement is implied.
  pH_reference_mixture_basis: 100 uL of 2x medium plus 100 uL of acid standard, before dye addition; this describes
    composition rather than the volume placed in the pH-meter vessel.
  pH_reference_dye_state: no_dye
  pH_adjustment: Do not apply a linear volume correction to pH or substitute stock-acid pH for final-mixture pH.
